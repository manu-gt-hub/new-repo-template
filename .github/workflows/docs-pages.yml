name: Docs site (GitHub Pages)

# Publishes docs-site/ (already generated and committed, nothing to build) to GitHub Pages.
# OFF by default: it only runs when the repository variable DOCS_PAGES is "true".
# Switch it on once (see docs/process/documentation-guide.md, "Publishing online"):
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
#   gh variable set DOCS_PAGES --body true --repo <owner>/<repo>
# The site is PUBLIC. For private docs use Cloudflare Pages + Access instead.

on:
  push:
    branches: [main]
    paths: ["docs-site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DOCS_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
