name: Task
description: Technical unit of work, ideally one day or less.
title: "[Task] "
labels: ["type:task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      value: |
        - [ ] Implementation
        - [ ] Tests
        - [ ] Docs updated
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      value: |
        - Depends on: none
        - Blocks: none
        - External: none
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Estimation (story points)
      options: ["1 (XS)", "2 (S)", "3 (M)", "5 (L)", "8 (XL)", "13 (XXL - must be split)"]
    validations:
      required: true
  - type: textarea
    id: how_to_test
    attributes:
      label: How to test
      value: |
        1. Automated:
        2. Manual:
    validations:
      required: true
  - type: textarea
    id: technical_notes
    attributes:
      label: Technical notes
      description: Approach, affected modules, risks.
  - type: input
    id: parent
    attributes:
      label: Parent story / epic
      placeholder: "#123"
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      options:
        - label: This task meets the Definition of Ready (docs/process/definition-of-ready.md)
          required: true
