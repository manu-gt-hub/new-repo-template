name: Epic
description: Large capability that groups several user stories.
title: "[Epic] "
labels: ["type:epic"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Goal of the epic, users affected and business value.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for the epic to be complete.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist (child stories)
      value: |
        - [ ] #
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      value: |
        - Depends on: none
        - Blocks: none
        - External: none
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Estimation (T-shirt size)
      options: ["S", "M", "L", "XL"]
    validations:
      required: true
  - type: textarea
    id: how_to_test
    attributes:
      label: How to test
      description: End-to-end scenarios that validate the epic.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      options:
        - label: This epic meets the Definition of Ready (docs/process/definition-of-ready.md)
          required: true
